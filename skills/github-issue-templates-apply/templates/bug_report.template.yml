# Starter template used by the github-issue-templates-apply skill.
# Append project-type-specific and audience-derived fields to `body:`
# after the baseline entries below. Do not edit this file in a target
# repository — the skill copies it into .github/ISSUE_TEMPLATE/bug_report.yml
# and customises the copy.
name: Bug Report
description: Report something that does not work as expected.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: checkboxes
    id: search
    attributes:
      label: Search
      description: Confirm you have looked for an existing report.
      options:
        - label: I have searched the existing issues for similar bug reports.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the unexpected behaviour.
    validations:
      required: true
  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps that consistently reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste logs, stack traces, or transcripts. They will be rendered as a code block.
      render: shell
    validations:
      required: false
  # ===== project-type-specific fields appended by the skill below this line =====
