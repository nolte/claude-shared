# Starter template used by the github-issue-templates-apply skill.
# Feature requests are deliberately permissive: the spec caps required
# fields at two (search acknowledgement + one substantive textarea) and
# forbids forcing reporters into a closed taxonomy (severity, priority,
# target release, milestone, owner). Project-type-specific extras
# appended by the skill below MUST be optional. See the spec at
# spec/project/github-issue-templates/ §"Feature requests — deliberately
# permissive". Do not edit this file in a target repository — the skill
# copies it into .github/ISSUE_TEMPLATE/feature_request.yml and
# customises the copy.
name: Feature Request
description: Suggest a new capability or improvement. Half-formed ideas welcome.
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: checkboxes
    id: search
    attributes:
      label: Search
      description: Confirm you have looked for an existing request.
      options:
        - label: I have searched the existing issues for similar feature requests.
          required: true
  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
      description: |
        Describe the capability, improvement, or change you'd like to see. There's no required shape — sketch the user need, the proposed change, alternatives you considered, screenshots, prior discussion, or anything else that helps the conversation. This is meant for half-formed ideas as much as for finished proposals.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Links, screenshots, related issues, or constraints not covered above.
    validations:
      required: false
  # ===== project-type-specific OPTIONAL fields appended by the skill below this line =====
  # Per spec, feature_request extras MUST stay optional even when the same field is required on bug_report.
