    - Renovate bot
  peers: []
- repo: nolte/taskfiles
  repo_url: https://github.com/nolte/taskfiles
  mission_statement: ""
  capabilities:
  - name: reusable-taskfile-collection
    description: >-
      A collection of remotely-includable Taskfiles (src/taskfile-include-*.yaml
