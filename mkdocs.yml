site_name: claude-shared
site_url: https://nolte.github.io/claude-shared/
site_description: Shared Claude Code skills, agents and conventions — packaged as the nolte-shared plugin.
site_author: nolte

repo_url: https://github.com/nolte/claude-shared
repo_name: nolte/claude-shared
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 nolte

docs_dir: docs

# Skill/Agent catalog generator, wired as an on_pre_build hook so the catalog
# regenerates inside every `mkdocs build` — including the bare `mkdocs gh-deploy`
# run by the docs-deploy pipeline — without a Taskfile/CI step. The hook shares
# its render core with the script's CLI entry point (one generator, multiple
# invocation surfaces). This is the spec's recommended pre-build surface for
# repos on mkdocs-static-i18n folder mode: physical pages written here are
# collected by MkDocs (file collection runs after on_pre_build) and localized
# like hand-authored pages. See spec/claude/skill-agent-catalog/ §Generation
# mechanism.
hooks:
  - scripts/docs/gen_catalog.py

theme:
  name: material
  language: de

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Zum Dunkelmodus wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Zum Hellmodus wechseln

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - header.autohide
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

plugins:
  - search:
      lang:
        - de
        - en
      separator: '[\s\-,:!=\[\]()\"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

  - i18n:
      docs_structure: folder
      languages:
        - locale: de
          name: Deutsch
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Startseite: Home
            Plugin nutzen: Using nolte-shared
            Erste Schritte: Getting Started
            Installation: Installation
            Nutzung: Usage
            Guides: Guides
            References: References
            Projekt: Project
            Portfolio: Portfolio
            Skills: Skills
            Agents: Agents
            Tags: Tags
            Spezifikationen: Specifications
            Skill-Autorenschaft: Skill Authoring
            Agent-Autorenschaft: Agent Authoring
            Skill-Management: Skill Management
            Spec: Spec
            Skills-Konzept: Skills Concept
            Agents-Konzept: Agents Concept
            Entwicklungszyklus: Development Lifecycle
            Testautomatisierung: Test Automation
            Bildgenerierung: Image Generation
            Entwicklung: Development
            Projektstruktur: Project Structure
            Architekturüberblick: Architecture overview
            Schnittstellen: Interfaces
            Beitragen: Contributing
            Fehlerbehebung: Troubleshooting
            Glossar: Glossary
            Datenschutz: Privacy

  - literate-nav:
      nav_file: SUMMARY.md

  - include-markdown:
      # spec/project/mkdocs-structure/ §Snippet inclusion (DRY) names `{%` / `%}`
      # as the canonical opening/closing tags, but those collide with verbatim
      # occurrences of the directive inside skill-body prose that the catalog
      # generator renders into docs/<lang>/skills/**. We pin custom tags here
      # so the plugin's regex doesn't fire on doc-examples, per
      # spec/project/mkdocs-structure/ §Snippet inclusion (tags pinned per-repo).
      opening_tag: "{!"
      closing_tag: "!}"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nolte/claude-shared

nav:
  - Startseite: de/index.md
  - Erste Schritte:
      - de/getting-started/index.md
      - Plugin nutzen: de/using.md
      - Installation: de/getting-started/installation.md
      - Nutzung: de/getting-started/usage.md
  - Guides:
      - de/guides/index.md
      - Entwicklung: de/guides/development.md
      - Projektstruktur: de/guides/project-structure.md
      - Architekturüberblick: de/guides/architecture.md
      - Schnittstellen: de/guides/interfaces.md
      - Beitragen: de/guides/contributing.md
      - Fehlerbehebung: de/guides/troubleshooting.md
      - Glossar: de/guides/glossary.md
      - Skills-Konzept: de/guides/skills-concept.md
      - Skill-Management: de/guides/skill-management.md
      - Spec: de/guides/spec.md
      - Agents-Konzept: de/guides/agents-concept.md
      - Entwicklungszyklus: de/guides/development-lifecycle.md
      - Testautomatisierung: de/guides/test-automation.md
      - Bildgenerierung: de/guides/image-generation.md
  - References:
      - de/references/index.md
      - Spezifikationen:
          - de/references/specs/index.md
          - Skill-Autorenschaft: de/references/specs/skill-management.md
          - Agent-Autorenschaft: de/references/specs/agent-management.md
      - Tags: de/references/tags.md
  - Projekt:
      - de/project/index.md
      - Datenschutz: de/privacy.md
  - Portfolio: de/portfolio/index.md
  - Skills: de/skills/
  - Agents: de/agents/
