# Catalog source roots for scripts/docs/gen_catalog.py.
#
# See spec/claude/skill-agent-catalog/en.md §"Generation mechanism".
#
# Plugin mode (this repo is itself a Claude Code plugin):
# the local plugin MUST be the first entry and represents the repository's own
# skills/ and agents/ folders. Additional external plugin source roots MAY follow.

sources:
  - name: nolte-shared
    local: .
    skills_path: skills
    agents_path: agents
    repo_url: https://github.com/nolte/claude-shared
    branch: main
  # Second in-repo plugin (media generation). Source root is plugins/nolte-media/;
  # its skills/ and agents/ are scoped to that root, distinct from the nolte-shared
  # root above. See spec/claude/plugin-scoping/ §"When to split into a separate plugin".
  - name: nolte-media
    local: ./plugins/nolte-media
    skills_path: skills
    agents_path: agents
    repo_url: https://github.com/nolte/claude-shared
    branch: main
  # Third in-repo plugin (engineering: implementation + test + quality + code audits).
  # Scoped to plugins/nolte-engineering/; consumed by code-bearing repos on top of
  # nolte-shared. See spec/claude/plugin-scoping/ §"When to split into a separate plugin".
  - name: nolte-engineering
    local: ./plugins/nolte-engineering
    skills_path: skills
    agents_path: agents
    repo_url: https://github.com/nolte/claude-shared
    branch: main
  # Fourth in-repo plugin (Claude skill/agent authoring, carved out of nolte-shared
  # by the F-18 flip 2026-07-22). Scoped to plugins/nolte-claude-dev/; adopted on top
  # of nolte-shared only by consumers who author Claude Code skills or agents.
  # See spec/claude/plugin-scoping/ §"When to split into a separate plugin".
  - name: nolte-claude-dev
    local: ./plugins/nolte-claude-dev
    skills_path: skills
    agents_path: agents
    repo_url: https://github.com/nolte/claude-shared
    branch: main
  # Fifth in-repo plugin (project-planning cadence: mission, roadmap, feature,
  # sprint). Scoped to plugins/nolte-planning/; adopted on top of nolte-shared
  # only by repositories that plan in project/. See spec/claude/plugin-scoping/
  # §"When to split into a separate plugin".
  - name: nolte-planning
    local: ./plugins/nolte-planning
    skills_path: skills
    agents_path: agents
    repo_url: https://github.com/nolte/claude-shared
    branch: main
