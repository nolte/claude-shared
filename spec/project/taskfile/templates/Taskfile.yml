# https://taskfile.dev
#
# Worked example of a consumer Taskfile that wires the shared MkDocs automation
# from https://github.com/nolte/taskfiles, per spec/project/taskfile/
# §"Shared Taskfiles from `nolte/taskfiles`". A repository bootstrap adapts this
# file rather than reverse-engineering the convention.
#
# Pair it with templates/ci.yml. Introducing a remote include is a two-file
# change: an `includes:` block without the matching workflow half turns a green
# pipeline red on the next run.

version: '3'

vars:
  # One declared, reviewable source for every remote include, so no include
  # carries an inline URL of its own.
  #
  # Replace <ref> with an immutable ref — a release tag or a full commit SHA —
  # never a moving branch. `task --yes` (see templates/ci.yml) suppresses the
  # trust prompt that would otherwise surface a changed upstream file, so a
  # moving ref lets an unreviewed upstream push execute in this repository's
  # next build.
  TASK_COLLECTION_BASE: https://raw.githubusercontent.com/nolte/taskfiles/<ref>/src

  # The project-local virtual environment required by
  # spec/project/project-structure/ §Python development.
  VENV: .venv

includes:
  # The module activates the machine-global `~/.venvs/docs` interpreter by
  # default, which spec/project/project-structure/ §Python development forbids
  # for project dependencies. Passing PYTHON_VENV_DIR_DOCS redirects it at this
  # repository's project-local environment.
  #
  # Override the leaf variable. Passing PYTHON_VENVS_BASEDIR alone does not
  # reach PYTHON_VENV_DIR_DOCS: a variable derived inside the module's own
  # `vars:` block reads the module's base value, not the consumer's.
  mkdocs:
    taskfile: "{{.TASK_COLLECTION_BASE}}/taskfile-include-mkdocs.yaml"
    vars:
      PYTHON_VENV_DIR_DOCS: "{{.VENV}}"

# Deliberately absent: taskfile-include-pre-commit.yaml. Sharing a topic with a
# module doesn't make its targets usable. That module activates the
# machine-global `~/.venvs/development` interpreter, which a project-local
# `.venv` repository doesn't provision, so `lint` below stays a local target.
# Verify that an included target exists AND that its environment assumptions
# hold in this repository before delegating to it.

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task -l
    silent: true

  setup:
    desc: One-time onboarding — install the git hooks into the local environment
    cmds:
      - "{{.VENV}}/bin/pre-commit install"

  install:
    desc: |
      Create the project-local virtual environment and install dependencies.
      The runtime and documentation install sets are installed independently,
      with no -r chaining between the requirements files.
    cmds:
      - python3 -m venv {{.VENV}}
      - "{{.VENV}}/bin/python -m pip install --upgrade pip"
      - "{{.VENV}}/bin/python -m pip install -r requirements.txt"
      - "{{.VENV}}/bin/python -m pip install -r docs/requirements.txt"

  lint:
    desc: Run the linters
    cmds:
      - "{{.VENV}}/bin/pre-commit run --all-files"

  test:
    desc: Run the test suite
    cmds:
      - "{{.VENV}}/bin/python -m pytest"

  docs:
    desc: Build the documentation site, failing on any warning
    cmds:
      - task: mkdocs:build

  docs:serve:
    desc: Serve the documentation site locally with live reload
    cmds:
      - task: mkdocs:start

  check:
    desc: |
      Aggregate quality gate. The local convenience entry point; CI keeps each
      category as its own required check while calling the same targets.
      What this composes is governed by spec/project/quality-gate/.
    cmds:
      - task: lint
      - task: test
      - task: docs
