# https://taskfile.dev
#
# Worked example of a consumer Taskfile that wires the shared MkDocs automation
# from https://github.com/nolte/taskfiles, per spec/project/taskfile/
# §"Shared Taskfiles from `nolte/taskfiles`". A repository bootstrap adapts this
# file rather than reverse-engineering the convention.
#
# Pair it with templates/ci.yml. Introducing a remote include is a two-file
# change: an `includes:` block without the matching workflow half turns a green
# pipeline red on the next run.

version: '3'

vars:
  # One declared, reviewable source for every remote include, so no include
  # carries an inline URL of its own.
  #
  # Replace <ref> with an immutable ref — a release tag or a full commit SHA —
  # never a moving branch. `task --yes` (see templates/ci.yml) suppresses the
  # trust prompt that would otherwise surface a changed upstream file, so a
  # moving ref lets an unreviewed upstream push execute in this repository's
  # next build.
  #
  # The ref MUST resolve to a module that exposes `mkdocs:build` AND declares
  # its variables in the overridable `'{{.NAME | default "…"}}'` form. The
  # `docs` target below delegates to the former, and the `includes:` override
  # below depends on the latter. A ref that predates either one leaves this
  # Taskfile broken in a way the trust prompt won't warn about: `task docs`
  # aborts with `Task "mkdocs:build" does not exist`, or the override is
  # silently ignored and the build runs against the machine-global
  # interpreter. Read the module at the ref before pinning it, and where no
  # release yet carries both, either pin the commit SHA that does or keep
  # `docs` a local target until one is cut.
  TASK_COLLECTION_BASE: https://raw.githubusercontent.com/nolte/taskfiles/<ref>/src

  # The project-local virtual environment required by
  # spec/project/project-structure/ §Python development.
  VENV: .venv

includes:
  # The module activates the machine-global `~/.venvs/docs` interpreter by
  # default, which spec/project/project-structure/ §Python development forbids
  # for project dependencies. Passing PYTHON_VENV_DIR_DOCS redirects it at this
  # repository's project-local environment.
  #
  # Override the leaf variable — the one whose value reaches the command. An
  # override of a variable the module only derives another one from never
  # arrives.
  #
  # Pass it absolute. The module's tasks declare `dir: '{{.USER_WORKING_DIR}}'`,
  # so they run in the directory `task` was invoked from, and they activate the
  # interpreter through a bare `source {{.PYTHON_VENV_DIR_DOCS}}/bin/activate`.
  # A relative `.venv` therefore resolves against the caller's directory and the
  # activation fails from anywhere but the root, with a shell error that names
  # nothing about the cause. The module's usage comment shows the relative form;
  # prefer the absolute one below.
  #
  # `{{.ROOT_DIR}}` is the directory of the Taskfile that started the run, which
  # is this file whenever it's the entry point, so the value doesn't depend on
  # where `task` was invoked.
  #
  # Don't reach for `{{.TASKFILE_DIR}}` here. Inside an `includes:` `vars:` block
  # it names the *included* module's directory rather than this file's, and for
  # a remote include such as this one it resolves to the empty string, so the
  # override collapses to `/.venv` and `task docs` then fails from every
  # directory, the repository root included. Measured against Task 3.52.0; see
  # spec/project/taskfile/ §Sources.
  #
  # The one case `{{.ROOT_DIR}}` doesn't cover is a parent Taskfile including
  # this one, where it points at the parent. A repository that nests this file
  # passes the path explicitly instead.
  #
  # This fixes the interpreter path only. `mkdocs build` still runs in the
  # caller's directory, so `task docs` from a subdirectory now gets past
  # activation and fails on the missing `mkdocs.yml` instead. Run it from the
  # repository root, or pin the build's own directory, if that matters to you.
  mkdocs:
    taskfile: "{{.TASK_COLLECTION_BASE}}/taskfile-include-mkdocs.yaml"
    vars:
      PYTHON_VENV_DIR_DOCS: "{{.ROOT_DIR}}/{{.VENV}}"

# Deliberately absent: taskfile-include-pre-commit.yaml. Sharing a topic with a
# module doesn't make its targets usable. That module activates the
# machine-global `~/.venvs/development` interpreter, which a project-local
# `.venv` repository doesn't provision, so `lint` below stays a local target.
# Verify that an included target exists AND that its environment assumptions
# hold in this repository before delegating to it.

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task -l
    silent: true

  setup:
    desc: |
      One-time onboarding — bootstrap the project-local environment, then
      install the git hooks into it. The `install` dependency is what makes
      this runnable in a fresh clone: the hook binary lives in the virtual
      environment, so installing hooks before creating it fails.
    deps:
      - install
    cmds:
      - "{{.VENV}}/bin/pre-commit install"

  install:
    desc: |
      Create the project-local virtual environment and install dependencies.
      Each install set is installed independently, with no -r chaining between
      the requirements files. The dev set carries the toolchain the `lint` and
      `test` targets below invoke, so omitting it leaves those targets — and
      the CI job that calls them — failing on a missing binary.
    cmds:
      - python3 -m venv {{.VENV}}
      - "{{.VENV}}/bin/python -m pip install --upgrade pip"
      - "{{.VENV}}/bin/python -m pip install -r requirements.txt"
      - "{{.VENV}}/bin/python -m pip install -r requirements-dev.txt"
      - "{{.VENV}}/bin/python -m pip install -r docs/requirements.txt"

  lint:
    desc: Run the linters
    cmds:
      - "{{.VENV}}/bin/pre-commit run --all-files"

  test:
    desc: Run the test suite
    cmds:
      - "{{.VENV}}/bin/python -m pytest"

  docs:
    desc: Build the documentation site, failing on any warning
    cmds:
      - task: mkdocs:build

  docs:serve:
    desc: Serve the documentation site locally with live reload
    cmds:
      - task: mkdocs:start

  check:
    desc: |
      Aggregate quality gate. The local convenience entry point; CI keeps each
      category as its own required check while calling the same targets.
      What this composes is governed by spec/project/quality-gate/.
    cmds:
      - task: lint
      - task: test
      - task: docs
