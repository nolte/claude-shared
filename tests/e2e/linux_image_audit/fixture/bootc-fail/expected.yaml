# Expected linux-image-scanner results for this fixture. Schema and scoring:
# tests/e2e/linux_image_audit/scenario.py. Each result cites the rule of
# spec/project/linux-image-best-practices/en.md it is derived from.
case: bootc-fail
summary: >-
  bootc image built with a committed literal --source-date-epoch value and a
  CycloneDX-only SBOM.
covers: [family:bootc:fail, pillar:c-literal-epoch]
declaration:
  path: image-declaration.yaml
  result: valid
  exit_code: 0
  violations: []
  spec: "§A image declaration (schema v1.2); validator §F conditional rules"
checks: [f-applies]
results:
  - id: declaration-schema
    section: declaration
    match: [schema]
    expected: valid
    spec: "§A image declaration; scanner Phase 2 relays the validator result unchanged"
  - id: declaration-conditional
    section: declaration
    match: [conditional]
    expected: ok
    spec: "§F preamble; validator conditional.* rules all hold"
  - id: c-source-date-epoch
    section: "§C"
    row: "§C SOURCE_DATE_EPOCH from source"
    match: ["SOURCE_DATE_EPOCH|epoch"]
    expected: fail
    spec: "§J row '§C SOURCE_DATE_EPOCH from source': a committed literal goes stale with the next commit and is a fail (Open Question 'Constant SOURCE_DATE_EPOCH literals' undecided, so §J applies as written); §I.5 bootc 'supported'"
  - id: c-inputs-pinned
    section: "§C"
    row: "§C inputs pinned"
    match: [pin]
    exclude: ["lock file committed", "lock committed", updat, renovate]
    expected: not-decidable
    cause: delegated
    spec: "§C bootc base-image pinning delegated to spec/project/dockerfile-best-practices/; §J cause delegated"
  - id: g-spdx-for-oci
    section: "§G"
    row: "§G SPDX for OCI images"
    match: [OCI]
    expected: fail
    spec: "§G MUST produce SPDX for an OCI (bootc) image; §J row '§G SPDX for OCI images': the generator writes cyclonedx-json only"
