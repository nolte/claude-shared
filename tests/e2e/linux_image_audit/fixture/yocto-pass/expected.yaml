# Expected linux-image-scanner results for this fixture. Schema and scoring:
# tests/e2e/linux_image_audit/scenario.py. Each result cites the rule of
# spec/project/linux-image-best-practices/en.md it is derived from.
case: yocto-pass
summary: >-
  Yocto scarthgap (5.0) image built through kas, every layer pinned to a commit
  plus a kas lock file, RAUC with a [keyring] trust anchor, create-spdx.
covers: [family:yocto:pass]
declaration:
  path: image-declaration.yaml
  result: valid
  exit_code: 0
  violations: []
  spec: "§A image declaration (schema v1.2); validator §F conditional rules"
checks: [no-pillar-fail, f-applies]
results:
  - id: declaration-schema
    section: declaration
    match: [schema]
    expected: valid
    spec: "§A image declaration; scanner Phase 2 relays the validator result unchanged"
  - id: declaration-conditional
    section: declaration
    match: [conditional]
    expected: ok
    spec: "§F preamble; validator conditional.* rules all hold"
  - id: c-inputs-pinned
    section: "§C"
    row: "§C inputs pinned"
    match: [pin]
    exclude: ["lock file committed", "lock committed", updat, renovate]
    expected: pass
    spec: "§C pinned inputs; §I.2 every layer pinned to a commit (kas); §I table Yocto 4.0 or later 'supported'"
  - id: c-lock-committed
    section: "§C"
    row: "§C lock file committed"
    match: ["lock|manifest", "commit|tracked"]
    expected: pass
    spec: "§C lock file committed; §J row static-file: kas.lock.yml exists and is tracked; §I table 'supported'"
  - id: c-source-date-epoch
    section: "§C"
    row: "§C SOURCE_DATE_EPOCH from source"
    match: ["SOURCE_DATE_EPOCH|epoch"]
    expected: [pass, not-decidable]
    cause: unverified
    spec: "§I.2 Yocto 4.0 or later derives SOURCE_DATE_EPOCH on its own, [unverified]; §I table 'experimental'"
  - id: d-host-keys
    section: "§D"
    row: "§D no host keys or secrets"
    match: ["host key|secret"]
    exclude: [credential, layer]
    expected: pass
    spec: "§D no SSH host keys; §J row '§D no host keys or secrets' (static-heuristic): no committed key file in the overlay"
  - id: f-payload-signature
    section: "§F"
    row: "§F payload signature verified"
    match: [signature]
    expected: pass
    spec: "§I.2 RAUC: a trust anchor in [keyring] (path=) is a pass ([R21] at tier); §J row '§F payload signature verified'"
  - id: f-install-reboot
    section: "§F"
    row: "§F install and reboot without input, unhealthy reboot"
    match: ["install|reboot"]
    exclude: [gates, "health definition", signature]
    expected: not-decidable
    cause: resolvable
    scenario: rollback
    spec: "§J row '§F install and reboot without input, unhealthy reboot' (needs-built-artifact): resolved by the rollback scenario"
  - id: f-downgrade
    section: "§F"
    row: "§F refuses a version that isn't newer"
    match: ["downgrade|newer"]
    exclude: [install]
    expected: not-decidable
    cause: resolvable
    scenario: downgrade
    spec: "§J row '§F refuses a version that isn't newer' (needs-built-artifact): cause resolvable: downgrade"
  - id: f-commit-boundary
    section: "§F"
    row: "§F failure switch ignored once committed"
    match: ["committed|commit-boundary|commit boundary"]
    expected: not-decidable
    cause: resolvable
    scenario: commit-boundary
    spec: "§J row '§F failure switch ignored once committed' (needs-built-artifact): cause resolvable: commit-boundary"
  - id: g-sbom-produced
    section: "§G"
    row: "§G SBOM produced"
    match: ["produc|generat|per build|machine-readable"]
    exclude: [OCI, legal, publish, "next to"]
    expected: pass
    spec: "§G; §I.2 Yocto create-spdx (INHERIT += create-spdx in the kas local_conf_header); §J row '§G SBOM produced'"
