[system]
compatible=appliance-qemux86-64
bootloader=efi
max-bundle-download-size=1073741824

[keyring]
path=/etc/rauc/appliance-ca.cert.pem

[slot.efi.0]
device=/dev/sda
type=boot-gpt-switch
region-start=1M
region-size=64M

[slot.rootfs.0]
device=/dev/sda2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/sda3
type=ext4
bootname=B
