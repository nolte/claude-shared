schema_version: "1.2"
image:
  name: appliance
  toolchain: ostree
  definition: appliance.yaml
  architectures: [x86_64]
  firmware: uefi
update_model: field-updated
boot_chain:
  secure_boot: omitted
  uki: omitted
  dm_verity: omitted
  measured_boot: omitted
health:
  definition:
    kind: framework-hook
    name: greenboot/check/required.d/10-appliance.sh
  tolerated_units: []
  failure_switch:
    type: systemd-credential
    name: image.health.fail-version
update:
  mechanism: ostree
  source_switch:
    type: systemd-credential
    name: image.update.source
  max_boot_attempts: 3
