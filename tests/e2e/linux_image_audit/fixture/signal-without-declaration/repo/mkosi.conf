[Config]
MinimumVersion=26

[Distribution]
Distribution=debian
Release=bookworm
Snapshot=20261101T000000Z

[Output]
Format=disk
ImageId=edge-appliance
ImageVersion=1.4.0

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
Packages=
        systemd
        systemd-boot
        systemd-repart
        systemd-sysupdate
        udev
        linux-image-amd64
Environment=SOURCE_DATE_EPOCH
