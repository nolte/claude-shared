# Expected linux-image-scanner results for this fixture. Schema and scoring:
# tests/e2e/linux_image_audit/scenario.py. Each result cites the rule of
# spec/project/linux-image-best-practices/en.md it is derived from.
case: buildroot-pass
summary: >-
  reflash-only Buildroot BR2_EXTERNAL tree with BR2_REPRODUCIBLE=y and an SPDX
  SBOM generated besides make legal-info.
covers: [family:buildroot:pass]
declaration:
  path: image-declaration.yaml
  result: valid
  exit_code: 0
  violations: []
  spec: "§A image declaration (schema v1.2); validator §F conditional rules"
checks: [no-pillar-fail, f-exempt]
results:
  - id: declaration-schema
    section: declaration
    match: [schema]
    expected: valid
    spec: "§A image declaration; scanner Phase 2 relays the validator result unchanged"
  - id: declaration-conditional
    section: declaration
    match: [conditional]
    expected: ok
    spec: "§F preamble; validator conditional.* rules all hold"
  - id: c-inputs-pinned
    section: "§C"
    match: [pin]
    exclude: [lock, updat, renovate]
    expected: not-decidable
    cause: spec-gap
    spec: "§I table Buildroot: inputs pinned 'not covered'; §J row '§C inputs pinned': a profile without a named pinning knob yields spec-gap"
  - id: c-lock-committed
    section: "§C"
    match: [lock]
    expected: not-decidable
    cause: spec-gap
    spec: "§I table Buildroot: lock file committed 'not covered'; §J cause spec-gap"
  - id: c-reproducibility-switch
    section: "§C"
    match: [switch]
    expected: [pass, not-decidable]
    cause: unverified
    spec: "§I.2 Buildroot BR2_REPRODUCIBLE=y [unverified]; §I table 'experimental'"
  - id: d-host-keys
    section: "§D"
    match: ["host key"]
    expected: pass
    spec: "§D no SSH host keys; §J row '§D no host keys or secrets' (static-heuristic): no committed key file in the overlay"
  - id: g-sbom-produced
    section: "§G"
    match: ["produc"]
    expected: pass
    spec: "§G SBOM per build; §J row '§G SBOM produced': an SPDX generator runs from the build entry point"
  - id: g-not-legal-info-alone
    section: "§G"
    match: ["legal"]
    expected: pass
    spec: "§G MUST NOT count make legal-info alone; §J row '§G not legal-info alone': a generator runs besides it"
