# Expected linux-image-scanner results for this fixture. Schema and scoring:
# tests/e2e/linux_image_audit/scenario.py. Each result cites the rule of
# spec/project/linux-image-best-practices/en.md it is derived from.
case: yocto-fail
summary: >-
  Yocto scarthgap image whose kas layers float on a branch (no commit, no
  lock), and whose local.conf header sets SOURCE_DATE_EPOCH from the clock.
covers: [family:yocto:fail, cause:unverified]
declaration:
  path: image-declaration.yaml
  result: valid
  exit_code: 0
  violations: []
  spec: "§A image declaration (schema v1.2); validator §F conditional rules"
checks: [f-applies]
results:
  - id: declaration-schema
    section: declaration
    match: [schema]
    expected: valid
    spec: "§A image declaration; scanner Phase 2 relays the validator result unchanged"
  - id: declaration-conditional
    section: declaration
    match: [conditional]
    expected: ok
    spec: "§F preamble; validator conditional.* rules all hold"
  - id: c-inputs-pinned
    section: "§C"
    row: "§C inputs pinned"
    match: [pin]
    exclude: [lock, updat, renovate]
    expected: fail
    spec: "§C: a build resolving the newest version is a hard failure; §I.2 every layer pinned to a commit; §I table Yocto 'supported'; §J static-heuristic"
  - id: c-source-date-epoch
    section: "§C"
    row: "§C SOURCE_DATE_EPOCH from source"
    match: ["SOURCE_DATE_EPOCH|epoch"]
    expected: not-decidable
    cause: unverified
    spec: "§I.2: SOURCE_DATE_EPOCH from ${@time.time()} counts as wall-clock, but the Yocto reproducibility statements are [unverified], so the finding is not-decidable with a Warning, not fail; §J"
