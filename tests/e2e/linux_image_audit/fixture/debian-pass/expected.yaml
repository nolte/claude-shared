# Expected linux-image-scanner results for this fixture. Schema and scoring:
# tests/e2e/linux_image_audit/scenario.py. Each result cites the rule of
# spec/project/linux-image-best-practices/en.md it is derived from.
case: debian-pass
summary: >-
  reflash-only mmdebstrap image from a snapshot.debian.org timestamp kept in a
  committed snapshot.lock, SOURCE_DATE_EPOCH from the last commit, per-machine
  state removed at the end of the build, SPDX SBOM published with the image.
covers: [family:debian:pass]
declaration:
  path: image-declaration.yaml
  result: valid
  exit_code: 0
  violations: []
  spec: "§A image declaration (schema v1.2); validator §F conditional rules"
checks: [no-pillar-fail, f-exempt]
results:
  - id: declaration-schema
    section: declaration
    match: [schema]
    expected: valid
    spec: "§A image declaration; scanner Phase 2 relays the validator result unchanged"
  - id: declaration-conditional
    section: declaration
    match: [conditional]
    expected: ok
    spec: "§F preamble; validator conditional.* rules all hold"
  - id: c-inputs-pinned
    section: "§C"
    row: "§C inputs pinned"
    match: [pin]
    exclude: ["lock file committed", "lock committed", updat, renovate]
    expected: pass
    spec: "§C; §I.3 archive pinned to a snapshot.debian.org timestamp (snapshot.lock); §I table Debian 'supported'"
  - id: c-lock-committed
    section: "§C"
    row: "§C lock file committed"
    match: ["lock|manifest", "commit|tracked|present|version control|checked in"]
    expected: pass
    spec: "§C commit the lock or manifest file; §J row '§C lock file committed' (static-file): snapshot.lock exists and is tracked; §I table Debian 'supported'"
  - id: c-source-date-epoch
    section: "§C"
    row: "§C SOURCE_DATE_EPOCH from source"
    match: ["SOURCE_DATE_EPOCH|epoch"]
    expected: pass
    spec: "§C SOURCE_DATE_EPOCH derived from the source (the last commit), never the wall clock; §J row '§C SOURCE_DATE_EPOCH from source': git log -1 --format=%ct in the entry point; §I table Debian 'supported'. §I.3 accepts the last-commit timestamp as well as the snapshot moment read from the committed pin"
  - id: c-reproducibility-switch
    section: "§C"
    row: "§C reproducibility switch"
    match: [switch]
    expected: pass
    spec: "§I.3: SOURCE_DATE_EPOCH set for mmdebstrap is the reproducibility switch; §I table Debian 'supported'"
  - id: d-host-keys
    section: "§D"
    row: "§D no host keys or secrets"
    match: ["host key|secret"]
    exclude: [credential, layer, log]
    expected: pass
    spec: "§D no SSH host keys; §J row '§D no host keys or secrets' (static-heuristic): no committed key file in the overlay"
  - id: g-sbom-produced
    section: "§G"
    row: "§G SBOM produced"
    match: ["produc|generat|per build|machine-readable"]
    exclude: [OCI, legal, publish, "next to"]
    expected: pass
    spec: "§G SBOM per build; §J row '§G SBOM produced': an SPDX generator runs from the build entry point"
