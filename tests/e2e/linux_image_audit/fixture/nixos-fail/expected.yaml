# Expected linux-image-scanner results for this fixture. Schema and scoring:
# tests/e2e/linux_image_audit/scenario.py. Each result cites the rule of
# spec/project/linux-image-best-practices/en.md it is derived from.
case: nixos-fail
summary: >-
  reflash-only NixOS flake without a committed flake.lock, evaluated impurely
  with builtins.currentTime.
covers: [family:nixos:fail]
declaration:
  path: image-declaration.yaml
  result: valid
  exit_code: 0
  violations: []
  spec: "§A image declaration (schema v1.2); validator §F conditional rules"
checks: [f-exempt]
results:
  - id: declaration-schema
    section: declaration
    match: [schema]
    expected: valid
    spec: "§A image declaration; scanner Phase 2 relays the validator result unchanged"
  - id: declaration-conditional
    section: declaration
    match: [conditional]
    expected: ok
    spec: "§F preamble; validator conditional.* rules all hold"
  - id: c-lock-committed
    section: "§C"
    match: [lock]
    expected: fail
    spec: "§C commit the lock file; §I.4 committed flake.lock; §J row '§C lock file committed' (static-file); §I table NixOS 'supported'"
  - id: c-inputs-pinned
    section: "§C"
    match: [pin]
    exclude: [lock, updat, renovate]
    expected: fail
    spec: "§C pin Nix inputs through a committed lock file; without flake.lock the flake inputs resolve the newest revision; §I table NixOS 'supported'"
