schema_version: "1.2"
image:
  name: edge-appliance
  toolchain: mkosi
  definition: mkosi.conf
  architectures: [x86_64]
  firmware: uefi
update_model: field-updated
boot_chain:
  secure_boot: omitted
  uki: omitted
  dm_verity: omitted
  measured_boot: omitted
health:
  definition:
    kind: unit
    name: appliance-health.service
  tolerated_units: []
  failure_switch:
    type: systemd-credential
    name: image.health.fail-version
update:
  mechanism: systemd-sysupdate
  source_switch:
    type: systemd-credential
    name: image.update.source
  max_boot_attempts: 3
