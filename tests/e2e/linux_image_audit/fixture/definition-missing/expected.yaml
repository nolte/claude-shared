# Expected linux-image-scanner results for this fixture. Schema and scoring:
# tests/e2e/linux_image_audit/scenario.py. Each result cites the rule of
# spec/project/linux-image-best-practices/en.md it is derived from.
case: definition-missing
summary: >-
  A valid declaration whose image.definition (images/edge-appliance/mkosi.conf)
  doesn't exist in the repository.
covers: [discovery:definition-missing]
declaration:
  path: images/edge-appliance/image-declaration.yaml
  result: valid
  exit_code: 0
  violations: []
  spec: "§A image declaration (schema v1.2); validator §F conditional rules"
checks: []
results:
  - id: a-declaration
    section: "§A"
    match: ["declaration|definition"]
    exclude: [health, "entry point", toolchain]
    expected: fail
    spec: "§A image declaration next to the image definition; scanner Phase 1 step 3: an image.definition path that doesn't exist is a §A fail"
