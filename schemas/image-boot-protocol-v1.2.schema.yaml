        flaky: false
        attempt: 1
        network:
          mode: restricted-forward
          config: "-netdev user,id=n0,restrict=on,guestfwd=tcp:10.0.2.100:8080-tcp:127.0.0.1:38080"
          forward: {protocol: tcp, guest_address: 10.0.2.100, guest_port: 8080, host_address: 127.0.0.1, host_port: 38080}
        phases:
