    unsigned_payload:
      path: test-payloads/edge-appliance_1.5.0.unsigned.raw
      digest: "sha256:8b0d1f3a5c7e9b2d4f6a8c0e1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f2a4c6e8b0d"
      expected_version: "1.5.0"
      production: "build entry point run for 1.5.0 with the signing step skipped; never published"
    image_definition_commit: 605926fb3c1d2e4f5a6b7c8d9e0f1a2b3c4d5e6f
    declaration:
      path: images/edge-appliance/image-declaration.yaml
      digest: "sha256:1a3c5e7b9d2f4a6c8e0b1d3f5a7c9e2b4d6f8a0c1e3b5d7f9a2c4e6b8d0f1a3c"
      schema_version: "1.1"
      image_name: edge-appliance
    firmware: {type: uefi, build: /usr/share/OVMF/OVMF_CODE_4M.secboot.fd (edk2 2025.02-8), secure_boot: true}
    tpm_emulated: false
    hypervisor: {name: /usr/bin/qemu-system-x86_64, version: "10.0.2"}
    machine:
      architecture: {name: x86_64, source: declaration}
      machine_type: q35
      cross_architecture: false
    acceleration: {mode: hardware}
    timeouts:
      readiness: {seconds: 300, source: default}
      update_installation: {seconds: 600, source: default}
      rollback: {seconds: 1200, source: default}
      total_margin: {seconds: 120, source: default}
      update_window: {seconds: 600, source: default}
      recovery: {seconds: 1200, source: default}
    scenarios:
      - name: smoke
        required: true
        verdict: pass
        flaky: false
        attempt: 1
        network: {mode: none, config: "-nic none"}
        phases:
          - {name: readiness, timeout_s: 300, duration_s: 41.7}
        report_lines:
          - "IMAGE-HEALTH-REPORT status=healthy image_id=edge-appliance image_version=1.4.0 system_state=starting failed_units=- machine_id_app=0f1e2d3c4b5a69788796a5b4c3d2e1f0"
        trace_ids: [linux-image-best-practices §A health definition]
      - name: rollback
