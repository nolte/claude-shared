          - "IMAGE-HEALTH-REPORT status=unhealthy image_id=edge-appliance image_version=1.5.0 system_state=starting failed_units=- machine_id_app=0f1e2d3c4b5a69788796a5b4c3d2e1f0"
          - "IMAGE-HEALTH-REPORT status=healthy image_id=edge-appliance image_version=1.4.0 system_state=starting failed_units=- machine_id_app=0f1e2d3c4b5a69788796a5b4c3d2e1f0"
