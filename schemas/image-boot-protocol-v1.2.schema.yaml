          - "IMAGE-HEALTH-REPORT status=healthy image_id=edge-appliance image_version=1.4.0 system_state=starting failed_units=- machine_id_app=0f1e2d3c4b5a69788796a5b4c3d2e1f0"
        trace_ids: [linux-image-best-practices §F payload signature]
        signature_variants:
          - {name: untrusted-key, verdict: pass, observed_versions: ["1.4.0", "1.4.0"], source_requests: 3}
          - {name: unsigned, verdict: pass, observed_versions: ["1.4.0", "1.4.0"], source_requests: 2}
      - name: commit-boundary
        required: false
        verdict: pass
        flaky: false
        attempt: 1
        network: {mode: none, config: "-nic none"}
        phases:
          - {name: readiness, timeout_s: 300, duration_s: 37.6}
          - {name: reset-readiness, timeout_s: 300, duration_s: 37.9}
        report_lines:
          - "IMAGE-HEALTH-REPORT status=healthy image_id=edge-appliance image_version=1.5.0 system_state=starting failed_units=- machine_id_app=0f1e2d3c4b5a69788796a5b4c3d2e1f0"
          - "IMAGE-HEALTH-REPORT status=healthy image_id=edge-appliance image_version=1.5.0 system_state=starting failed_units=- machine_id_app=0f1e2d3c4b5a69788796a5b4c3d2e1f0"
        trace_ids: [linux-image-best-practices §F failure switch ignored once committed]
        observed_versions: ["1.5.0", "1.5.0"]
      - name: interrupted-update
        required: false
        verdict: pass
        flaky: false
        attempt: 1
        network:
          mode: restricted-forward
          config: "-netdev user,id=n0,restrict=on,guestfwd=tcp:10.0.2.100:8080-tcp:127.0.0.1:38084"
          forward: {protocol: tcp, guest_address: 10.0.2.100, guest_port: 8080, host_address: 127.0.0.1, host_port: 38084}
        phases:
          - {name: readiness, timeout_s: 300, duration_s: 40.4}
          - {name: payload-delivery, timeout_s: 600, duration_s: 61.3}
          - {name: recovery, timeout_s: 1200, duration_s: 44.8}
        report_lines:
          - "IMAGE-HEALTH-REPORT status=healthy image_id=edge-appliance image_version=1.4.0 system_state=starting failed_units=- machine_id_app=0f1e2d3c4b5a69788796a5b4c3d2e1f0"
          - "IMAGE-HEALTH-REPORT status=healthy image_id=edge-appliance image_version=1.4.0 system_state=starting failed_units=- machine_id_app=0f1e2d3c4b5a69788796a5b4c3d2e1f0"
        trace_ids: [linux-image-best-practices §F atomic update]
        observed_versions: ["1.4.0", "1.4.0"]
        source_requests: 1
        interruption: {trigger: payload-delivered, after_s: 0}
    rollback_observed_versions: ["1.4.0", "1.5.0", "1.5.0", "1.5.0", "1.4.0"]
