# Version-bearing file declaration for spec/project/release-automation/ §Version-bearing files.
#
# This repository is a plugin monorepo shipping four Claude Code plugins from
# one release line (lockstep): nolte-shared (root), nolte-media,
# nolte-engineering, and nolte-claude-dev. The plugins were split on
# distribution-contract differences (consumer audience / runtime dependency) —
# NOT on a different release cadence — so all four carry the same version, equal
# to the repository's release tag.
#
# The default Claude-plugin convention only covers the root .claude-plugin/
# plugin.json and marketplace.json metadata.version, which would leave the three
# sub-plugin manifests to drift. This explicit list REPLACES the default and
# brings every plugin's own plugin.json into the pre-publish alignment gate.
#
# Note: the marketplace.json `plugins[].version` array entries are deliberately
# NOT listed — the reusable-release-publish aligner walks scalar dot-path
# selectors only (no array selector), and plugin-version resolution takes each
# plugin's own plugin.json `version` first, so those array entries are dropped
# from marketplace.json rather than tracked here.
version_bearing_files:
  - path: .claude-plugin/plugin.json
    selector: version
  - path: .claude-plugin/marketplace.json
    selector: metadata.version
  - path: plugins/nolte-media/.claude-plugin/plugin.json
    selector: version
  - path: plugins/nolte-engineering/.claude-plugin/plugin.json
    selector: version
  - path: plugins/nolte-claude-dev/.claude-plugin/plugin.json
    selector: version
