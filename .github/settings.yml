# Last propagation: 2026-09-13 — re-apply this file after the Probot Settings App
# was re-authorized. Live develop protection had enforced only lint/test/docs with
# enforce_admins and strict false. Verify through the API, not the settings page:
#   gh api repos/nolte/claude-shared/branches/develop/protection

# No `@<ref>` suffix: @probot/octokit-plugin-config matches _extends against
# `^(owner/)?repo(:path.ya?ml)?$`, so `...commons-settings.yml@v1.1.19` is an
# invalid value, the config load throws, and the app applies nothing from this
# file (src/util/extends-to-get-content-params.ts). The loader reads the commons
# from gh-plumbing's default branch; there is no way to pin it here.
_extends: gh-plumbing:.github/commons-settings.yml

repository:
  name: claude-shared
  description: Shared Claude Code skills and agents for consistent development workflows across projects.
  homepage: https://nolte.github.io/claude-shared
  default_branch: develop
  # A comma-separated string, never a YAML list: probot/settings calls .split() on
  # topics, and a list throws after the repository PATCH, which silently skips the
  # whole branches block (nolte/gh-plumbing#416).
  topics: claude-code, claude-code-plugin, skills, agents, nolte-shared, nolte-media, nolte-engineering, ai-agents
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  # Local override pending an upstream addition in
  # gh-plumbing:.github/commons-settings.yml. Without this, the platform
  # leaves merged feature branches behind, forcing a manual cleanup REST
  # call on every pull-request-merge run (observed across PRs #45, #46, #47).
  delete_branch_on_merge: true

branches:
  - name: develop
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: false
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        # spec/project/quality-gate/ §"Enforced lane per tier": every tier the
        # local gate runs needs at least one required lane here, and where a
        # context name doesn't say which tier it runs, the declaration says it.
        # `task check` composes lint + test + check:links; `docs` and `pr-lint`
        # are the additional declared categories.
        contexts:
          - lint # tier: lint — `task lint` (pre-commit across all files, incl. Vale prose and section references)
          - test # tier: tests — `task test` (skill/agent frontmatter validation + pytest under tests/)
          - docs # tier: docs build — `task docs` (mkdocs build --strict) + the portfolio-inventory freshness diff
          - links # tier: link validation — `task check:links` (offline internal + cross-tree slice)
          - pr-lint # tier: pull-request prose — scripts/check_prose.py (Vale on the title)
          - pr-body / PR Lint # tier: pull-request structure — nolte/gh-plumbing reusable-pr-lint.yaml (five sections, class sweep on `fix`, spec anchor, audit traceability)
      enforce_admins: true
      restrictions: null
  # Release tags `v*` are protected by the repository ruleset
  # `release-tags-immutable` (deletion, update, and non-fast-forward blocked),
  # created through the rulesets API on 2026-09-13 (#586); the settings app
  # manages branches only. See docs/*/guides/release-delivery.md.
  - name: main
    protection:
      required_pull_request_reviews: null
      required_status_checks: null
      enforce_admins: true
      required_linear_history: true
      # The release step resets `main` to the published tag with a force push
      # (release-cd-refresh-master); enforce_admins alone would refuse it
      # (nolte/gh-plumbing#414). Operator decision 2026-09-13.
      allow_force_pushes: true
      restrictions: null
