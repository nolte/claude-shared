_extends: nolte/gh-plumbing:.github/commons-settings.yml@v1.1.15

repository:
  name: claude-shared
  description: Shared Claude Code skills and agents for consistent development workflows across projects.
  homepage: https://nolte.github.io/claude-shared
  default_branch: develop
  topics:
    - claude-code
    - claude-code-plugin
    - skills
    - agents
    - nolte-shared
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

branches:
  - name: develop
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: false
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        contexts:
          - lint
          - test
          - docs
      enforce_admins: true
      restrictions: null
  - name: main
    protection:
      required_pull_request_reviews: null
      required_status_checks: null
      enforce_admins: true
      required_linear_history: true
      restrictions: null
