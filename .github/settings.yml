_extends: nolte/gh-plumbing:.github/commons-settings.yml

repository:
  name: claude-shared
  description: Shared Claude Code skills and agents for consistent development workflows across projects.
  homepage: https://nolte.github.io/claude-shared
  default_branch: develop
  topics:
    - claude-code
    - claude-code-plugin
    - skills
    - agents
    - nolte-shared

branches:
  - name: develop
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: false
        require_code_owner_reviews: false
      required_status_checks:
        strict: false
        contexts:
          - lint
          - test
          - docs
      enforce_admins: false
      restrictions: null
