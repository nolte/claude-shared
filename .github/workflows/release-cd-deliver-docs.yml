on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish_docs:
    uses: nolte/gh-plumbing/.github/workflows/reusable-mkdocs.yaml@d51e51ec3ec17ceea09fe9eb40ac00857b6fa1be # v2.0.0
    with:
      requirements: docs/requirements.txt
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      id-token: write
      pages: write
    # spec/project/github-actions-best-practices/ §F: this is a delivery
    # workflow, so §F's third rule forbids cancel-on-new-run — cancelling a run
    # in flight can leave the Pages site partially published. This block
    # previously carried `cancel-in-progress: true`, which was that violation;
    # GitHub's own Pages workflow template sets it false for the same reason.
    #
    # The group deliberately carries no branch identity. A repository has exactly
    # one Pages deployment target, so the resource is global; a per-branch group
    # would let two runs deploy to the same site concurrently, which is the
    # interference the group exists to prevent.
    concurrency:
      cancel-in-progress: false
      group: "pages"
