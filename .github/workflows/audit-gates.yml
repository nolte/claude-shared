# Continuous audit gates, per two 2026-Q3 spec-drift findings (#496):
#
# - spec/project/dependency-audit/ MUSTs a CVE check on dependency changes in
#   addition to the quarterly full audit (the quarterly cadence is the
#   audit-cadence-reminder workflow; full-audit records live under
#   .audits/dependency-audit/).
# - spec/project/license-check/ §Triggers MUSTs a continuous CI check on
#   changes touching a dependency manifest, a lockfile, the LICENSE file, or
#   committed AI-generated artifacts. The deterministic CI slice is a
#   drift gate: the SBOM's license identifiers must all be covered by the
#   adjudicated baseline of the latest full license-check record
#   (.audits/license-check/license-baseline.json); classification and policy
#   stay with the license-check skill.
name: audit-gates

on:
  pull_request:
    paths:
      - "requirements*.txt"
      - "docs/requirements.txt"
      - "evals/requirements-*.txt"
      - "LICENSE"
      - "design/**"
      - ".audits/license-check/license-baseline.json"
      - "scripts/check_licenses.py"
      - ".github/workflows/audit-gates.yml"

permissions:
  contents: read

# spec/project/github-actions-best-practices/ §F, examined rule by rule.
#
# The conditional group MUST is *not* triggered here. Both jobs read: one runs
# pip-audit over the manifests, the other builds a throwaway virtualenv and
# compares the SBOM against the committed baseline. Neither writes outside its
# own runner — no draft, no label, no branch, no published artifact — so two runs
# on one pull request hold nothing the other could race.
#
# The group below comes from §F's cancel-on-new-run SHOULD for pre-merge lanes
# instead: a superseded run keeps consuming capacity while reporting a verdict
# about a commit nobody is waiting on any more. Neither job is a required context
# on `develop` (.github/settings.yml names only `lint`, `test`, `docs`, `links`),
# so superseding one cannot leave a commit carrying a `cancelled` required check.
#
# The `github.run_id` fallback is inert under the current `pull_request`-only
# trigger, where the pull-request number is always populated. It is there so that
# adding a `push` or `workflow_dispatch` trigger later cannot silently collapse
# every run into a single group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cve-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: pip-audit over every Python manifest
        run: |
          pip install --quiet pip-audit
          pip-audit --progress-spinner=off \
            -r requirements.txt \
            -r requirements-dev.txt \
            -r docs/requirements.txt \
            -r evals/requirements-dev.txt \
            -r evals/requirements-eval.txt

  license-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Build the CycloneDX SBOM (same install set as task license:sbom)
        run: |
          python -m venv .sbom-venv
          .sbom-venv/bin/pip install --quiet \
            -r docs/requirements.txt \
            -r evals/requirements-dev.txt \
            -r requirements-dev.txt \
            cyclonedx-bom
          .sbom-venv/bin/cyclonedx-py environment .sbom-venv -o sbom.cdx.json
      - name: License-drift gate against the adjudicated baseline
        run: python3 scripts/check_licenses.py
