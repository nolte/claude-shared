name: Release Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        # The reusable workflow this job consumes
        # (nolte/gh-plumbing reusable-release-publish.yml) declares `tag` as
        # required and owns the draft-resolve / multi-draft-guard logic. Per
        # spec/project/release-automation/ §Operational contract the input is
        # conceptually optional with a resolve path, but that resolution lives
        # in the reusable, not here; keeping this passthrough required matches
        # the reusable's contract (passing an empty tag would fail its
        # Resolve-draft step).
        description: "Draft tag to publish. Must match an existing release-drafter draft."
        required: true
        type: string
      dry_run:
        description: "Validate only; do not flip draft -> published."
        required: false
        default: false
        type: boolean

# spec/project/github-actions-best-practices/ §B: read-only at the workflow level.
# `license-verdict` only reads the checkout; the `contents: write` the publish
# needs is granted on the `publish` job alone.
permissions:
  contents: read

# spec/project/release-automation/ §Workflow existence and trigger SHOULD: two
# overlapping dispatches must queue rather than race on the `--draft=false` API
# call, so `cancel-in-progress` stays false — cancelling a half-finished publish
# is worse than serialising.
#
# Examined against spec/project/github-actions-best-practices/ §F and left as is.
# §F's second rule wants the group derived from the workflow identity plus a
# branch or pull-request identity; this group carries the workflow identity
# alone, deliberately. The resource being serialised is the repository's single
# open release draft, which is global rather than per-branch, so a per-branch
# group would let two dispatches race the same `--draft=false` call — the exact
# interference the group exists to prevent. `release-drafter.yml` scopes the same
# draft globally, for the same reason; the two files have to agree.
#
# §F's second rule guards against runs on different branches cancelling each
# other, and that consequence is accepted here rather than argued away. With
# `cancel-in-progress` false an in-flight publish is never interrupted, but GitHub
# still supersedes a *pending* run the moment a newer dispatch queues into the
# group — so a second dispatch made while a publish is running can be dropped as
# `cancelled` and has to be re-dispatched. Serialising the `--draft=false` call is
# worth that cost.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  # Pre-publish gate per spec/project/license-check/ §Triggers, cadence, and
  # CI: a full check is required before every release tag, so the publish is
  # refused while the latest persisted license-check verdict isn't `Pass`
  # (2026-Q3 audit finding license-check.ci-cadence-unwired, #496).
  license-verdict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Latest license-check record must carry verdict Pass
        run: |
          latest=$(ls .audits/license-check/license-*.md 2>/dev/null | sort | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::No license-check record under .audits/license-check/ — run the license-check skill before publishing."
            exit 1
          fi
          echo "Latest record: $latest"
          if ! awk '/^## Verdict/{f=1;next} f && NF {print; exit}' "$latest" | grep -q '^\*\*Pass'; then
            echo "::error::Latest license-check verdict in $latest is not Pass — resolve findings and re-run the license-check skill before publishing."
            exit 1
          fi

  publish:
    needs: license-verdict
    permissions:
      contents: write
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-publish.yml@d51e51ec3ec17ceea09fe9eb40ac00857b6fa1be # v2.0.0
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
