name: Release Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        # The reusable workflow this job consumes
        # (nolte/gh-plumbing reusable-release-publish.yml) declares `tag` as
        # required and owns the draft-resolve / multi-draft-guard logic. Per
        # spec/project/release-automation/ §Operational contract the input is
        # conceptually optional with a resolve path, but that resolution lives
        # in the reusable, not here; keeping this passthrough required matches
        # the reusable's contract (passing an empty tag would fail its
        # Resolve-draft step).
        description: "Draft tag to publish. Must match an existing release-drafter draft."
        required: true
        type: string
      dry_run:
        description: "Validate only; do not flip draft -> published."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# spec/project/release-automation/ §Workflow existence and trigger SHOULD: two
# overlapping dispatches must queue rather than race on the `--draft=false` API
# call, so `cancel-in-progress` stays false — cancelling a half-finished publish
# is worse than serialising.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  # Pre-publish gate per spec/project/license-check/ §Triggers, cadence, and
  # CI: a full check is required before every release tag, so the publish is
  # refused while the latest persisted license-check verdict isn't `Pass`
  # (2026-Q3 audit finding license-check.ci-cadence-unwired, #496).
  license-verdict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Latest license-check record must carry verdict Pass
        run: |
          latest=$(ls .audits/license-check/license-*.md 2>/dev/null | sort | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::No license-check record under .audits/license-check/ — run the license-check skill before publishing."
            exit 1
          fi
          echo "Latest record: $latest"
          if ! awk '/^## Verdict/{f=1;next} f && NF {print; exit}' "$latest" | grep -q '^\*\*Pass'; then
            echo "::error::Latest license-check verdict in $latest is not Pass — resolve findings and re-run the license-check skill before publishing."
            exit 1
          fi

  publish:
    needs: license-verdict
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-publish.yml@v1.1.26
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
