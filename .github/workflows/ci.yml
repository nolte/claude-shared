name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Taskfile.yml includes remote taskfiles from nolte/taskfiles;
  # Task gates that experimental feature behind this flag.
  TASK_X_REMOTE_TASKFILES: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Pinned to match the asdf-managed local version; the prose-style spec
      # requires local and CI to produce identical alerts. Bump in lock-step.
      VALE_VERSION: "3.14.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Vale
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version
      - run: task --yes lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deterministic eval-harness unit tests only; behavioural evals stay opt-in
      # (RUN_EVALS=1) and never run in CI, so no ANTHROPIC_API_KEY is needed here.
      - run: pip install -r evals/requirements-dev.txt
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task --yes test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task --yes docs
      - name: Verify committed catalog is fresh
        # Per spec/claude/skill-agent-catalog/ §Generation mechanism: the
        # repo commits the catalog (because reusable-mkdocs.yaml@v1.1.12
        # bypasses `task docs`); this step fails when the committed tree
        # has drifted from a fresh re-generation.
        run: |
          git diff --exit-code \
            docs/de/skills docs/de/agents docs/de/references/tags.md \
            docs/en/skills docs/en/agents docs/en/references/tags.md
      - name: Verify committed portfolio inventory is fresh
        # Per spec/portfolio/portfolio-management/ §Documentation rendering:
        # the rendered docs/<lang>/portfolio/ pages MUST be a pure function of
        # portfolio/aggregate.yml; this step fails when the committed pages
        # have drifted from a fresh re-generation.
        run: |
          git diff --exit-code \
            docs/de/portfolio docs/en/portfolio

  # spec/project/docs-freshness/ §Triggers and cadence SHOULD: a docs-freshness
  # run as a pre-PR gate whenever the PR modifies documentation. The full audit
  # is performed by the `docs-freshness-checker` LLM agent, which cannot run
  # unattended in CI (it needs a model, not a deterministic script). The two
  # `git diff --exit-code` freshness checks in the `docs` job above already
  # enforce the deterministic, machine-checkable slice of freshness (generated
  # catalog + portfolio inventory). The remaining SHOULD slice (internal-link
  # rot, parity, ADR/stale-marker drift) is consciously deferred to the
  # quarterly / pre-release agent run per spec/project/docs-freshness/
  # §Read-only discipline rather than wired as a CI script here; this comment
  # records that deliberate deferral so the missing pre-PR job is not mistaken
  # for an oversight. Promote to a real paths-filtered job once a deterministic
  # link-rot detector ships under scripts/.
  docs-freshness:
    if: false # deferred — see comment above
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "docs-freshness pre-PR gate is the agent run; deferred in CI"'
