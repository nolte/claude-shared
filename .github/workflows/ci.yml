name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Taskfile.yml includes remote taskfiles from nolte/taskfiles;
  # Task gates that experimental feature behind this flag.
  TASK_X_REMOTE_TASKFILES: "1"

# spec/project/quality-gate/ §Invocation contract ("MUST run the gate
# identically from a local workstation and from CI") and §Acceptance Criteria
# ("The documented invocation for the gate is identical between the README and
# its CI workflow"): the local gate is `task check`, which is composed of
# exactly `task lint` and `task test` (see Taskfile.yml `check.deps`). CI runs
# those same two targets, but as separate jobs rather than the single `task
# check` aggregate, on purpose:
#   - each becomes its own named required status check in .github/settings.yml,
#   - each gets isolated, minimal per-job dependency installs (pre-commit/Vale
#     for lint; pytest for test; MkDocs for docs),
#   - the jobs run in parallel, matching `task check`'s parallel `deps`.
# No environment branching makes CI stricter or looser than local — the gate is
# the identical set of Taskfile targets in both places. This comment is the
# documented CI↔local equivalence the spec calls for; do not collapse the jobs
# into a single `task check` step, which would erase the granular required-check
# names and per-job dependency isolation above.
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Pinned to match the asdf-managed local version; the prose-style spec
      # requires local and CI to produce identical alerts. Bump in lock-step.
      VALE_VERSION: "3.14.1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install pre-commit
      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Vale
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version
      - run: task --yes lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Deterministic eval-harness unit tests only; behavioural evals stay opt-in
      # (RUN_EVALS=1) and never run in CI, so no ANTHROPIC_API_KEY is needed here.
      - run: pip install -r evals/requirements-dev.txt
      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task --yes test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r docs/requirements.txt
      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # `task docs` runs `mkdocs build --strict`, which fires the gen_catalog.py
      # on_pre_build hook (mkdocs.yml `hooks:`) and so regenerates the catalog
      # as part of the build. The strict build is the freshness gate: a stale or
      # malformed catalog fails the build here. The catalog tree is no longer
      # committed (per spec/claude/skill-agent-catalog/ §Generation mechanism
      # "Deploy-time generation (preferred)"), so no committed-tree diff check is
      # needed — the deploy build (mkdocs gh-deploy) regenerates it identically.
      - run: task --yes docs
      - name: Verify committed portfolio inventory is fresh
        # Per spec/portfolio/portfolio-management/ §Documentation rendering:
        # the rendered docs/<lang>/portfolio/ pages MUST be a pure function of
        # portfolio/aggregate.yml; this step fails when the committed pages
        # have drifted from a fresh re-generation.
        run: |
          git diff --exit-code \
            docs/de/portfolio docs/en/portfolio

  # spec/project/link-validation/ §Triggers, cadence, and gating: the offline
  # slice (internal + intra-page-anchor + cross-tree links) is deterministic and
  # MUST run as a blocking CI gate on every PR. It runs unconditionally (not
  # paths-filtered): the run is sub-second, and a docs-only path filter would
  # miss a PR that renames a file under a referenced root (spec/, scripts/, …)
  # and so breaks a doc link without touching docs/. This is the "deterministic
  # link-rot detector" the docs-freshness deferral below was waiting for. The
  # external (networked) slice is NOT wired here — flakiness would make the gate
  # non-deterministic; it runs as the link-rot-scanner agent's periodic /
  # pre-release audit instead.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # `task check:links` regenerates the (uncommitted) catalog via its
      # `docs:catalog` dependency before scanning, so the offline link checker
      # sees the generated catalog pages. gen_catalog.py needs PyYAML; install
      # the pinned docs toolchain (single source of truth, Renovate-managed).
      - run: pip install -r docs/requirements.txt
      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task --yes check:links

  # spec/project/docs-freshness/ §Triggers and cadence SHOULD: a docs-freshness
  # run as a pre-PR gate whenever the PR modifies documentation. The full audit
  # is performed by the `docs-freshness-checker` LLM agent, which cannot run
  # unattended in CI (it needs a model, not a deterministic script). The
  # `git diff --exit-code` portfolio freshness check plus the `mkdocs build
  # --strict` in the `docs` job above already enforce the deterministic,
  # machine-checkable slice of freshness (the portfolio inventory by diff; the
  # catalog by the on_pre_build hook firing inside the strict build), and the
  # `links` job above now owns the
  # deterministic internal-link-rot + cross-tree-reference-rot slice per
  # spec/project/link-validation/ (which docs-freshness delegates to it). The
  # remaining SHOULD slice (parity, ADR/stale-marker drift, Mermaid drift) is
  # consciously deferred to the quarterly / pre-release agent run per
  # spec/project/docs-freshness/ §Read-only discipline rather than wired as a CI
  # script here; this comment records that deliberate deferral so the missing
  # pre-PR job is not mistaken for an oversight.
  docs-freshness:
    if: false # deferred — see comment above
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "docs-freshness pre-PR gate is the agent run; deferred in CI"'
