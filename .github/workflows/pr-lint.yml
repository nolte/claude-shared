name: pr-lint

# spec/project/pull-request-workflow/ §"PR lint workflow" MUSTs a workflow that
# lints PR title and body on these four events and registers its job as a
# required status check for `develop`. That section SHOULDs the linter as a
# reusable workflow under nolte/gh-plumbing so repositories inherit one
# implementation. No such reusable workflow exists yet, so this is the first
# implementation rather than a fork of one; upstreaming it is tracked separately.
on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-lint:
    runs-on: ubuntu-latest
    # The body checks run in the pr-body job below (#577); this job checks the
    # title prose with Vale and needs no more than read access to the sources.
    permissions:
      contents: read
    env:
      # Lock-step with the lint job in ci.yml; the prose-style spec requires local
      # and CI Vale runs to produce identical alerts.
      VALE_VERSION: "3.15.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      # spec/project/github-actions-best-practices/ on untrusted input: the PR
      # title and body are author-controlled, so they reach the checker through
      # the environment and never through `${{ }}` interpolation into a shell
      # command, where a crafted title would be executed. The author login is
      # GitHub-controlled but travels the same way; the checker exempts only the
      # exact logins on its dependency-bot allowlist from the body checks.
      - name: Install Vale
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version
      - name: Sync Vale styles
        run: vale sync
      # spec/project/prose-style/ §"Pull-request titles and release notes":
      # release-drafter publishes the title, so the title is what Vale checks,
      # with its Conventional-Commits prefix masked; the body is not linted.
      # Title and author reach the script through the environment, and the
      # script hands Vale a file it writes itself, never shell text.
      - name: Lint the pull-request title prose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/check_prose.py --title

  # #577: the pull-request body checks run in the reusable workflow in
  # nolte/gh-plumbing, pinned by commit SHA; required as `pr-body / PR Lint`.
  pr-body:
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: nolte/gh-plumbing/.github/workflows/reusable-pr-lint.yaml@f6d74ea585cb3ba5a864e046c23155ebb5b96769 # develop, nolte/gh-plumbing#418
    with:
      spec-anchor: true
