name: pr-lint

# spec/project/pull-request-workflow/ §"PR lint workflow" MUSTs a workflow that
# lints PR title and body on these four events and registers its job as a
# required status check for `develop`. That section SHOULDs the linter as a
# reusable workflow under nolte/gh-plumbing so repositories inherit one
# implementation. No such reusable workflow exists yet, so this is the first
# implementation rather than a fork of one; upstreaming it is tracked separately.
on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-lint:
    runs-on: ubuntu-latest
    # pull-requests: read lists the changed files for the spec-anchor rule (#585);
    # issues: read reads the labels of linked issues for the traceability rule (#616).
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      # Lock-step with the lint job in ci.yml; the prose-style spec requires local
      # and CI Vale runs to produce identical alerts.
      VALE_VERSION: "3.15.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      # spec/project/github-actions-best-practices/ on untrusted input: the PR
      # title and body are author-controlled, so they reach the checker through
      # the environment and never through `${{ }}` interpolation into a shell
      # command, where a crafted title would be executed. The author login is
      # GitHub-controlled but travels the same way; the checker exempts only the
      # exact logins on its dependency-bot allowlist from the body checks.
      # The file names reach the checker through a file, never through the shell.
      - name: List the pull request's changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > "${RUNNER_TEMP}/changed-files.txt"
      # The checker parses `## Linked issues` itself and prints only issue numbers,
      # so the loop below handles digits, never body text. An unreadable issue is
      # reported as a warning; the rule then can't see its label.
      - name: Read the labels of the linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          : > "${RUNNER_TEMP}/linked-issue-labels.txt"
          for n in $(python3 scripts/check_pr_body.py --print-linked-issues); do
            if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${n}" --jq '.labels[].name' | sed "s/^/${n} /" >> "${RUNNER_TEMP}/linked-issue-labels.txt"; then
              echo "::warning::could not read the labels of linked issue #${n}"
            fi
          done
      - name: Lint the pull-request title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.head_ref }}
          CHANGED_FILES_FILE: ${{ runner.temp }}/changed-files.txt
          LINKED_ISSUE_LABELS_FILE: ${{ runner.temp }}/linked-issue-labels.txt
        run: python3 scripts/check_pr_body.py
      - name: Install Vale
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version
      - name: Sync Vale styles
        run: vale sync
      # spec/project/prose-style/ §"Pull-request titles and release notes":
      # release-drafter publishes the title, so the title is what Vale checks,
      # with its Conventional-Commits prefix masked; the body is not linted.
      # Title and author reach the script through the environment, and the
      # script hands Vale a file it writes itself, never shell text.
      - name: Lint the pull-request title prose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/check_prose.py --title
