# Derivation record (per spec/project/github-issue-templates/):
#   project-type: claude-code-plugin
#   detection-signals: .claude-plugin/plugin.json, skills/, agents/
#   audience-artefact: AUDIENCES.md
#   audience-fingerprint: 2026-04-30 (assumed-only, no confirmed audiences yet)
#   templates: [bug_report.yml, feature_request.yml]
#   generated: 2026-04-30
#   has_discussions: false (checked via `gh api repos/nolte/claude-shared`)
#   security-contact: SECURITY.md (repo root) → private vulnerability reporting
blank_issues_enabled: false
# A security contact_link is REQUIRED per spec/project/github-issue-templates/
# §"derivation step 6": now that SECURITY.md exists, the chooser points at the
# repository's security policy, which routes reporters to GitHub private
# vulnerability reporting. Discussions are not enabled, so no Discussions link.
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/nolte/claude-shared/security/policy
    about: >-
      Do not file security vulnerabilities as public issues. Read the security
      policy and report privately via GitHub's private vulnerability reporting.
