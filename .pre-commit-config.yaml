# See https://pre-commit.com for usage and config reference.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^\.audits/lektorat/.*\.diff$'
      - id: end-of-file-fixer
        exclude: '^\.audits/lektorat/.*\.diff$'
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-d, relaxed]

  - repo: local
    hooks:
      - id: guard-primary-checkout
        name: primary checkout must stay on develop
        entry: scripts/guard_primary_checkout.sh
        language: system
        always_run: true
        pass_filenames: false

      - id: vale-prose
        name: vale (prose style)
        entry: task lint:prose
        language: system
        types: [markdown]
        pass_filenames: false

      # The skill-agent catalog is no longer committed: it is regenerated by the
      # gen_catalog.py on_pre_build hook inside every `mkdocs build` (mkdocs.yml
      # `hooks:`), including the deploy build, per spec/claude/skill-agent-catalog/
      # §Generation mechanism. There is therefore no committed tree to keep fresh
      # on commit, so the former `docs-catalog-fresh` hook (and precommit_catalog.sh)
      # were removed; `mkdocs build --strict` in CI's `docs` job is the freshness gate.

      - id: validate-skills
        name: validate skill/agent frontmatter
        entry: python3 scripts/validate_skills.py
        language: system
        files: '^(skills/.*/SKILL\.md|agents/.*\.md|plugins/[^/]+/skills/.*/SKILL\.md|plugins/[^/]+/agents/.*\.md)$'
        pass_filenames: false

      - id: validate-features
        name: validate feature frontmatter and slug-rename gate
        entry: python3 scripts/validate_features.py
        language: system
        files: '^project/features/.*\.md$'
        pass_filenames: false

      - id: validate-schemas
        name: validate JSON schema files and governed data
        entry: python scripts/validate_schemas.py
        language: python
        additional_dependencies: ["jsonschema>=4.20", "PyYAML>=6"]
        always_run: true
        pass_filenames: false

      - id: check-spec-inheritance
        name: local-vs-inherited spec drift (portfolio-inherited-spec-layer)
        entry: python scripts/check_spec_inheritance.py
        language: python
        additional_dependencies: ["PyYAML>=6"]
        always_run: true
        pass_filenames: false

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args:
          - --disable
          - MD013  # line-length
          - MD022  # blanks-around-headings
          - MD032  # blanks-around-lists
          - MD033  # no-inline-html
          - MD036  # no-emphasis-as-heading
          - MD040  # fenced-code-language
          - MD041  # first-line-h1
          - MD049  # emphasis-style (allow underscore)
          - MD060  # table-column-style (mixed pipe spacing across existing tables)
          - --
