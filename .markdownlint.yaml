# markdownlint config — keeps the rule set from .pre-commit-config.yaml's
# inline --disable list and adds the front-matter-aware tweak below.
#
# Disabled rules (kept here for visibility; the canonical list is in
# .pre-commit-config.yaml so the CLI invocation stays self-describing):
# MD013, MD022, MD032, MD033, MD036, MD040, MD041, MD049.

# MD025 (single-title): treat the YAML `title:` frontmatter key as the page's
# document-meta title, not as an H1. The per-page contract in
# spec/project/mkdocs-structure/ §Per-page structure mandates BOTH the
# frontmatter `title:` AND a body `# H1`, which the default MD025 setting
# (front_matter_title: "^\\s*title\\s*[:=]") wrongly counts as two H1s.
MD025:
  front_matter_title: ""
