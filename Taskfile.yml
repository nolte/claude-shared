# https://taskfile.dev

version: '3'

vars:
  TASK_COLLECTION_BASE: https://raw.githubusercontent.com/nolte/taskfiles/develop/src

includes:
  mkdocs: "{{.TASK_COLLECTION_BASE}}/taskfile-include-mkdocs.yaml"
  pre-commit: "{{.TASK_COLLECTION_BASE}}/taskfile-include-pre-commit.yaml"

tasks:
  default:
    cmds:
      - task -l
    silent: true

  setup:
    desc: Install pre-commit hooks (run once after cloning)
    cmds:
      - task: pre-commit:install

  lint:
    desc: Run pre-commit across all files
    cmds:
      - pre-commit run --all-files

  lint:prose:
    desc: Run Vale prose linter across English-language Markdown
    cmds:
      - vale sync
      - vale README.md docs/en/ $(find spec -name 'en.md')

  test:
    desc: |
      Run the test suite: skill/agent frontmatter validation (static Layer 0) plus the
      eval-harness unit tests. Behavioural evals that drive a skill/agent are skipped
      unless RUN_EVALS=1. Requires pytest: `pip install -r evals/requirements-dev.txt`.
    cmds:
      - task: validate:skills
      - python3 -m pytest tests -q

  check:
    desc: |
      Run the develop quality gate locally: lint + test. The docs category
      is a separate CI job (the documentation-freshness gate, not the code
      gate). Exits zero on a clean tree and non-zero when any category fails.
    cmds:
      - task: lint
      - task: test

  validate:skills:
    desc: |
      Validate every skill and agent frontmatter against the structural rules
      from spec/claude/skill-management/ and spec/claude/agent-management/.
      Stop-gap for the upstream skills-ref CLI named in spec/claude/skill-review/
      §"Checks derived from external skill-structure validation"; exits non-zero
      on any Critical-grade finding.
    cmds:
      - python3 scripts/validate_skills.py

  image:generate:
    desc: |
      Generate an image from a text prompt via a pluggable provider backend
      (skills/image-generate/scripts/image_generate.py). Default provider is
      cloudflare (free tier, needs CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID);
      --provider pollinations is auth-free; --provider gemini requires billing.
      Pass script args after `--`, e.g.:
        task image:generate -- --prompt "a teal fox icon, flat" --out fox.png
        task image:generate -- --provider pollinations --prompt "a tree" --out tree.jpg
    cmds:
      - python3 skills/image-generate/scripts/image_generate.py {{.CLI_ARGS}}

  docs:catalog:
    desc: Generate the Skills/Agents catalog under docs/<lang>/{skills,agents}/
    cmds:
      - python3 scripts/docs/gen_catalog.py

  docs:
    desc: Build the MkDocs site (regenerates the catalog first)
    deps:
      - docs:catalog
    cmds:
      - mkdocs build --strict

  plugin:reload:
    desc: Start Claude Code with this repo loaded as a plugin (dogfooding)
    cmds:
      - claude --plugin-dir .
