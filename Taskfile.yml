# https://taskfile.dev

version: '3'

vars:
  # Pinned to an immutable release tag per spec/project/taskfile/ §Shared
  # Taskfiles. `task --yes` in .github/workflows/ci.yml suppresses Task's trust
  # prompt, so a moving branch ref would let an unreviewed upstream push execute
  # in this repository's next CI run.
  TASK_COLLECTION_BASE: https://raw.githubusercontent.com/nolte/taskfiles/v0.1.4/src

includes:
  mkdocs: "{{.TASK_COLLECTION_BASE}}/taskfile-include-mkdocs.yaml"
  pre-commit: "{{.TASK_COLLECTION_BASE}}/taskfile-include-pre-commit.yaml"

tasks:
  default:
    cmds:
      - task -l
    silent: true

  resume:
    desc: |
      List resumable Claude Code sessions for THIS working copy (newest first,
      with their opening prompt) and print the exact `claude --resume` command.
      Use after a notebook crash, terminal close, or session expiry to get back
      to an interrupted run — covers all top-level work, including free-form work
      no resumable skill governs. See also `.resume/session-journal.md` for the
      always-on "where was I" trail written by scripts/wip_journal.py.
    cmds:
      - python3 scripts/resume_sessions.py
    silent: true

  setup:
    desc: Install pre-commit hooks (run once after cloning)
    cmds:
      - task: pre-commit:install

  install:
    desc: |
      Create the project-local virtual environment (.venv) and install the
      repository's Python tooling into it, per spec/project/project-structure/
      §Python development: dependencies live in a project-local venv, never
      system-wide. Installs requirements.txt (runtime placeholder) and
      requirements-dev.txt (the script/test toolchain) independently — no -r
      chaining. The docs-build toolchain has its own install set in
      docs/requirements.txt.
    cmds:
      - python3 -m venv .venv
      - .venv/bin/python -m pip install --upgrade pip
      - .venv/bin/python -m pip install -r requirements.txt
      - .venv/bin/python -m pip install -r requirements-dev.txt
      - 'echo "Virtual environment ready: source .venv/bin/activate"'

  lint:
    desc: Run pre-commit across all files
    cmds:
      - pre-commit run --all-files

  lint:prose:
    desc: |
      Run the Vale prose linter across English-language Markdown.
      Requires Vale >= 3.14: the per-path `BasedOnStyles =` opt-outs in .vale.ini
      (the generated docs/*/skills|agents|portfolio trees, the German trees, the
      LLM-instruction artefacts) rely on section-glob matching that older Vale
      builds silently ignore, so an outdated binary reports hundreds of false
      errors against generated and non-English files. The preflight below fails
      fast with that explanation instead of drowning the caller in noise.
    cmds:
      - |
        installed="$(vale --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
        required="3.14.0"
        if [ "$(printf '%s\n%s\n' "$required" "$installed" | sort -V | head -1)" != "$required" ]; then
          echo "vale $installed is too old — this repo's .vale.ini needs >= $required." >&2
          echo "Older builds ignore the per-path BasedOnStyles opt-outs and report false errors" >&2
          echo "against the generated catalog, the German trees, and SKILL.md/agent files." >&2
          exit 1
        fi
      - vale sync
      - vale README.md docs/en/ $(find spec -name 'en.md')

  test:
    desc: |
      Run the test suite: skill/agent frontmatter validation (static Layer 0) plus the
      eval-harness unit tests. Behavioural evals that drive a skill/agent are skipped
      unless RUN_EVALS=1. Requires pytest: `pip install -r evals/requirements-dev.txt`.
    cmds:
      - task: validate:skills
      - task: validate:mission
      - python3 -m pytest tests -q

  check:
    desc: |
      Run the develop quality gate locally: lint + test + link check. The
      docs-freshness category is a separate (non-deterministic, LLM-agent) gate,
      not part of the code gate; the deterministic offline link check, by
      contrast, belongs here per spec/project/link-validation/ §Triggers.
      Exits zero on a clean tree and non-zero when any category fails.
    # spec/project/quality-gate/ §Invocation contract SHOULD: "run the
    # categories in parallel when the ecosystem permits it; sequential fallback
    # is acceptable when a category produces inputs another category consumes."
    # lint (pre-commit), test (frontmatter validation + pytest), and the offline
    # link check are independent — none consumes another's output — so they run
    # as parallel `deps`. Task waits for every dep and fails `check` if any
    # fails, so a failing category is never masked.
    deps:
      - lint
      - test
      - check:links

  check:links:
    desc: |
      Validate internal, intra-page-anchor, and cross-tree documentation links
      offline (deterministic, no network) per spec/project/link-validation/.
      Fails on any critical finding (a link whose target doesn't resolve). The
      external (networked) slice is the link-rot-scanner agent's job, not this
      gate. Run the full online checker directly with:
        python3 scripts/check_links.py            # internal + cross-tree + external
        python3 scripts/check_links.py --external  # external only
    deps:
      # The catalog tree under docs/<lang>/{skills,agents}/ is generated, not
      # committed (the on_pre_build hook produces it during a build). The offline
      # link checker scans the on-disk docs tree, so it must regenerate the
      # catalog first — otherwise hand-authored pages that link into the catalog
      # report false-positive "target does not exist" criticals.
      - docs:catalog
    cmds:
      - python3 scripts/check_links.py --offline

  deps:audit:
    desc: |
      Scan the Python dependency manifests for known CVEs with pip-audit, per
      spec/project/dependency-audit/ §Execution mechanics. This is the local
      reproduction of what the dependency-audit skill runs, so a contributor can
      reproduce a finding without dispatching the skill. Non-zero exit means at
      least one advisory matched. Requires uv (pip-audit runs via uvx, so no
      global install and no pollution of the working environment).
    cmds:
      - uvx pip-audit --progress-spinner=off -r requirements.txt -r requirements-dev.txt -r docs/requirements.txt -r evals/requirements-dev.txt -r evals/requirements-eval.txt

  license:sbom:
    desc: |
      Generate a CycloneDX SBOM with resolved licenses (including transitive
      dependencies) for the Python toolchain, per spec/project/license-check.
      Writes sbom.cdx.json (gitignored, reproducible). Requires uv.
    cmds:
      - uv venv .sbom-venv
      - uv pip install --python .sbom-venv -r docs/requirements.txt -r evals/requirements-dev.txt -r requirements-dev.txt
      - uvx --from cyclonedx-bom cyclonedx-py environment .sbom-venv -o sbom.cdx.json
      - rm -rf .sbom-venv
      - 'echo "CycloneDX SBOM (with licenses) written to sbom.cdx.json"'

  license:check:
    desc: |
      License-drift gate: build the SBOM (license:sbom) and verify every
      license identifier is covered by the adjudicated baseline of the latest
      full license-check record (.audits/license-check/license-baseline.json),
      per spec/project/license-check §Triggers. CI runs the same gate in
      .github/workflows/audit-gates.yml on manifest/LICENSE changes.
    deps: [license:sbom]
    cmds:
      - python3 scripts/check_licenses.py

  validate:skills:
    desc: |
      Validate every skill and agent frontmatter against the structural rules
      from spec/claude/skill-management/ and spec/claude/agent-management/.
      Stop-gap for the upstream skills-ref CLI named in spec/claude/skill-review/
      §"Checks derived from external skill-structure validation"; exits non-zero
      on any Critical-grade finding.
    cmds:
      - python3 scripts/validate_skills.py

  validate:mission:
    desc: |
      Validate project/mission.md frontmatter against the structural rules from
      spec/project/mission/ §"Frontmatter schema" and §"Body sections": field
      order, unknown keys, relevant_outcomes→goals.md and audiences→AUDIENCES.md
      resolution, verifies_via feature resolution, time_bound shape, and the
      mvp_status enum. A missing mission file is a pass (adoption is optional).
      Wired into `task test` and the validate-mission pre-commit hook; `--self-test`
      runs the negative-proof fixtures.
    cmds:
      - python3 scripts/validate_mission.py

  validate:schemas:
    desc: |
      Validate every *.schema.yaml against the JSON Schema 2020-12 meta-schema
      and every schema-bound data file against its schema, per
      spec/project/yaml-json-schema/ §Validation contract. A missing validator
      fails with an install hint rather than skipping. Wired into `task lint`
      via the validate-schemas pre-commit hook; this target runs it directly.
    cmds:
      - python3 scripts/validate_schemas.py

  validate:inheritance:
    desc: |
      Run the Local-vs-Inherited spec drift check, per
      spec/project/portfolio-inherited-spec-layer/ §"Drift detection" and
      §"Audit and CI integration" (undeclared divergence is a non-zero-exit CI
      error). On the hub (no inherits:) this validates Portfolio-Scope header
      hygiene and exits 0. Wired into `task lint` via the check-spec-inheritance
      pre-commit hook; this target runs it directly. A consumer passes the
      installed hub plugin's spec tree via --hub-spec-root (or $CLAUDE_PLUGIN_ROOT).
    cmds:
      - python3 scripts/check_spec_inheritance.py

  image:generate:
    desc: |
      Generate an image from a text prompt via a pluggable provider backend
      (skills/image-generate/scripts/image_generate.py). Default provider is
      cloudflare (free tier, needs CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID);
      --provider pollinations is auth-free; --provider gemini requires billing.
      Pass script args after `--`, e.g.:
        task image:generate -- --prompt "a teal fox icon, flat" --out fox.png
        task image:generate -- --provider pollinations --prompt "a tree" --out tree.jpg
    cmds:
      - python3 skills/image-generate/scripts/image_generate.py {{.CLI_ARGS}}

  docs:catalog:
    desc: >-
      Manually regenerate the Skills/Agents catalog under docs/<lang>/{skills,agents}/.
      Normally unnecessary — the catalog is regenerated by the gen_catalog.py
      on_pre_build hook inside `mkdocs build` (see mkdocs.yml `hooks:`); this
      standalone surface is for previewing the generated pages without a full build.
    cmds:
      - python3 scripts/docs/gen_catalog.py

  docs:portfolio:
    desc: Generate the portfolio inventory under docs/<lang>/portfolio/ from portfolio/aggregate.yml
    cmds:
      - python3 scripts/docs/gen_portfolio.py

  docs:
    desc: Build the MkDocs site (the catalog regenerates via the on_pre_build hook; portfolio inventory is regenerated first)
    deps:
      - docs:portfolio
    cmds:
      - mkdocs build --strict

  plugin:reload:
    desc: Start Claude Code with all in-repo plugins loaded (dogfooding)
    cmds:
      - claude --plugin-dir . --plugin-dir ./plugins/nolte-media --plugin-dir ./plugins/nolte-engineering --plugin-dir ./plugins/nolte-claude-dev

  worktree:root:
    desc: |
      Print the resolved worktree root for this machine. Reads
      NOLTE_WORKTREE_ROOT (the per-machine, freely chosen path) and falls
      back to ~/repos/.worktrees. See spec/project/parallel-working-copies/.
    silent: true
    cmds:
      - 'echo "${NOLTE_WORKTREE_ROOT:-$HOME/repos/.worktrees}"'

  worktree:add:
    desc: |
      Create a parallel working copy under the configurable worktree root,
      always in the same predictable place: ${NOLTE_WORKTREE_ROOT:-~/repos/.worktrees}/<repo>/<slug>/.
      The branch is created off origin/develop with an explicit base ref.
      Seeds a .resume/<slug>/plan.md plan stub in the worktree (plan-before-work
      gate) and reminds you to start the work in a fresh, resumable top-level
      session, per spec/project/parallel-working-copies/ §Lifecycle.
      Usage: task worktree:add -- <branch> [slug]
        task worktree:add -- feat/parser-fix
        task worktree:add -- chore/ci-tidy ci
    cmds:
      - ./scripts/worktree_add.sh {{.CLI_ARGS}}
