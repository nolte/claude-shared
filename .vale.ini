StylesPath = .github/styles
MinAlertLevel = error

Packages = Microsoft, RedHat, https://github.com/nolte/vale-style/releases/download/v0.1.14/nolte-styles.zip

Vocab = claude-shared, technical

IgnoredScopes = code,tt, em

[*.md]
BasedOnStyles = Vale, Microsoft

[CLAUDE.md]
BasedOnStyles =

# Auto-generated index of bilingual spec titles — both languages mixed.
[spec/README.md]
BasedOnStyles =

# Auto-generated skill and agent catalog (see scripts/docs/gen_catalog.py).
# The content is a verbatim transcription of SKILL.md / agent.md frontmatter
# and bodies; prose curation lives in the source files, not the rendered
# catalog. Skip Vale here so a single source-file rephrasing doesn't have
# to be mirrored across 36 generated pages.
[docs/*/skills/**]
BasedOnStyles =

[docs/*/agents/**]
BasedOnStyles =

# Auto-generated portfolio inventory (see scripts/docs/gen_portfolio.py).
# The content is a verbatim transcription of portfolio/aggregate.yml, which
# mirrors each member repo's project/portfolio.yml + mission.md; prose curation
# lives in those source manifests, not the rendered inventory. Skip Vale here
# for the same reason as the skill/agent catalog above.
[docs/*/portfolio/**]
BasedOnStyles =

[docs/*/tags.md]
BasedOnStyles =

# Non-English content (per spec/project/prose-style §Multilingual text):
# files authored in any language other than English MUST stay out of Vale's
# scope. The German documentation tree and every spec's German translation
# are maintained without Vale checks and use their own native vocabulary.
[docs/de/**]
BasedOnStyles =

[spec/**/de.md]
BasedOnStyles =

[*.de.md]
BasedOnStyles =

# LLM-instruction artifacts (per spec/project/prose-style §Multilingual text):
# SKILL.md files, their templates/examples, and agent files are
# tool-author-to-LLM instructions, not end-user prose. Applying
# Microsoft-style end-user-writing rules to them produces noise, not signal,
# so they stay outside Vale's scope.
[skills/**/SKILL.md]
BasedOnStyles =

[skills/**/templates/**]
BasedOnStyles =

[skills/**/examples/**]
BasedOnStyles =

[agents/*.md]
BasedOnStyles =
