StylesPath = .github/styles
MinAlertLevel = error

# Every package by versioned release URL, never a bare registry name that
# `vale sync` resolves to the newest release (spec/project/continuous-integration/
# §C, #768). Renovate bumps all three (renovate.json5 + the gh-plumbing preset).
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.2/Microsoft.zip, https://github.com/redhat-documentation/vale-at-red-hat/releases/download/v686/RedHat.zip, https://github.com/nolte/vale-style/releases/download/v0.2.1/nolte-styles.zip

Vocab = claude-shared, technical

IgnoredScopes = code,tt, em

[*.md]
BasedOnStyles = Vale, Microsoft
# spec/project/prose-style/ §Voice and tone: the Microsoft package ships BiasFree at
# `warning`, below MinAlertLevel, so it never failed the gate (2026-Q4 audit F102).
Microsoft.BiasFree = error
# An emptied BasedOnStyles drops the packages but not a rule enabled by name
# here, so every opt-out section below switches such rules off again
# (guarded by tests/test_vale_config.py).

[CLAUDE.md]
BasedOnStyles =
Microsoft.BiasFree = NO

# Auto-generated index of bilingual spec titles — both languages mixed.
[spec/README.md]
BasedOnStyles =
Microsoft.BiasFree = NO

# Auto-generated skill and agent catalog (see scripts/docs/gen_catalog.py).
# The content is a verbatim transcription of SKILL.md / agent.md frontmatter
# and bodies; prose curation lives in the source files, not the rendered
# catalog. Skip Vale here so a single source-file rephrasing doesn't have
# to be mirrored across 36 generated pages.
[docs/*/skills/**]
BasedOnStyles =
Microsoft.BiasFree = NO

[docs/*/agents/**]
BasedOnStyles =
Microsoft.BiasFree = NO

# Auto-generated portfolio inventory (see scripts/docs/gen_portfolio.py).
# The content is a verbatim transcription of portfolio/aggregate.yml, which
# mirrors each member repo's project/portfolio.yml + mission.md; prose curation
# lives in those source manifests, not the rendered inventory. Skip Vale here
# for the same reason as the skill/agent catalog above.
[docs/*/portfolio/**]
BasedOnStyles =
Microsoft.BiasFree = NO

[docs/*/tags.md]
BasedOnStyles =
Microsoft.BiasFree = NO

# Non-English content (per spec/project/prose-style §Multilingual text):
# files authored in any language other than English MUST stay out of Vale's
# scope. The German documentation tree and every spec's German translation
# are maintained without Vale checks and use their own native vocabulary.
[docs/de/**]
BasedOnStyles =
Microsoft.BiasFree = NO

[spec/**/de.md]
BasedOnStyles =
Microsoft.BiasFree = NO

[*.de.md]
BasedOnStyles =
Microsoft.BiasFree = NO

# LLM-instruction artifacts (per spec/project/prose-style §Multilingual text):
# SKILL.md files, their templates/examples, and agent files are
# tool-author-to-LLM instructions, not end-user prose. Applying
# Microsoft-style end-user-writing rules to them produces noise, not signal,
# so they stay outside Vale's scope.
[skills/**/SKILL.md]
BasedOnStyles =
Microsoft.BiasFree = NO

[skills/**/templates/**]
BasedOnStyles =
Microsoft.BiasFree = NO

[skills/**/examples/**]
BasedOnStyles =
Microsoft.BiasFree = NO

[agents/*.md]
BasedOnStyles =
Microsoft.BiasFree = NO

# The same artefacts ship inside each subdirectory plugin (plugins/<name>/);
# the root-relative globs above don't reach them, so each gets a twin here.
[plugins/*/skills/**/SKILL.md]
BasedOnStyles =
Microsoft.BiasFree = NO

[plugins/*/skills/**/templates/**]
BasedOnStyles =
Microsoft.BiasFree = NO

[plugins/*/skills/**/examples/**]
BasedOnStyles =
Microsoft.BiasFree = NO

[plugins/*/agents/*.md]
BasedOnStyles =
Microsoft.BiasFree = NO

# Repo-local Claude Code configuration (CLAUDE.md peers): .claude/rules/*.md
# are session-loaded LLM-instruction rules, not end-user prose — same category
# as CLAUDE.md above, so they stay outside Vale's scope.
[.claude/**]
BasedOnStyles =
Microsoft.BiasFree = NO
